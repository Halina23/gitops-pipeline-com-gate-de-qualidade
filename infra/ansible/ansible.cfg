[defaults]
# Ambiente padrão: VirtualBox. Para a AWS: -i inventory/aws/hosts.ini
inventory = inventory/virtualbox/hosts.ini

[ssh_connection]
# accept-new: aceita a impressão digital do servidor só na primeira conexão e
# recusa se ela mudar depois (proteção contra man-in-the-middle).
# ControlMaster/ControlPersist: reaproveita a conexão SSH entre tarefas (mais rápido).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

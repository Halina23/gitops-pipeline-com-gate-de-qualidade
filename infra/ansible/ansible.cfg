[defaults]
# Ambiente padrão: VirtualBox. Para a AWS: -i inventory/aws/hosts.ini
inventory = inventory/virtualbox/hosts.ini

[ssh_connection]
# accept-new: aceita a impressão digital do servidor só na primeira conexão e
# recusa se ela mudar depois (proteção contra man-in-the-middle).
# ControlMaster/ControlPersist: reaproveita a conexão SSH entre tarefas (mais rápido).
# ConnectTimeout: desiste de abrir a conexão em 10 s.
# ServerAliveInterval/CountMax: manda um "sinal de vida" a cada 15 s e desiste após
# 2 sem resposta (~30 s). Sem isso, uma conexão bloqueada no meio do caminho (ex.:
# o IP de quem administra mudou e o firewall passou a barrar) trava o playbook.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2

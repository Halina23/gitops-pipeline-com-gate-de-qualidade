---
# Instala o Argo CD, cria o Secret do banco do encurtador (fora do Git) e a
# Application raiz. A partir daí, o Argo CD faz o deploy a partir do Git.
- name: Instalar Argo CD e iniciar o GitOps
  hosts: k3s_server
  become: true

  vars:
    files_dir: "{{ playbook_dir }}/../files"
    templates_dir: "{{ playbook_dir }}/../templates"
    kubectl: /usr/local/bin/k3s kubectl
    # Arquivos locais da máquina de administração, fora do Git (ver README).
    config_local: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/gitops-lab"

  tasks:
    # Falha cedo, com mensagem clara, se faltar alguma configuração local.
    - name: Conferir os arquivos locais dos alertas (e-mails e senha de app do Gmail)
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ config_local }}/{{ item }}"
      loop: [alertas.yml, gmail-app-password]
      register: arquivos_locais

    - name: Parar se algum arquivo local estiver faltando
      ansible.builtin.assert:
        that: arquivos_locais.results | map(attribute='stat.exists') | min
        fail_msg: "Faltam arquivos em {{ config_local }}: alertas.yml e gmail-app-password (ver README)."
        quiet: true

    - name: Carregar os endereços dos alertas
      ansible.builtin.include_vars:
        file: "{{ config_local }}/alertas.yml"

    - name: Entregar o HelmChart do Argo CD ao helm-controller do k3s
      ansible.builtin.copy:
        src: "{{ files_dir }}/argocd-helmchart.yaml"
        dest: /var/lib/rancher/k3s/server/manifests/argocd.yaml
        mode: '0600'

    - name: Esperar o CRD de Application existir
      ansible.builtin.command: "{{ kubectl }} wait --for=condition=Established crd/applications.argoproj.io --timeout=10s"
      register: crd
      until: crd.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Esperar os componentes do Argo CD ficarem prontos
      ansible.builtin.command: "{{ kubectl }} -n argocd rollout status {{ item }} --timeout=300s"
      loop:
        - deployment/argocd-repo-server
        - deployment/argocd-server
        - statefulset/argocd-application-controller
      changed_when: false

    - name: Criar os namespaces que recebem Secrets fora do Git
      ansible.builtin.shell: "{{ kubectl }} create namespace {{ item }} --dry-run=client -o yaml | {{ kubectl }} apply -f -"
      loop: [encurtador, observabilidade]
      register: ns
      changed_when: "'created' in ns.stdout"

    - name: Verificar se o Secret do banco já existe
      ansible.builtin.command: "{{ kubectl }} -n encurtador get secret encurtador-db"
      register: db_secret
      failed_when: false
      changed_when: false

    # set_fact calcula a senha UMA vez. Uma variável comum seria recalculada a cada
    # uso (avaliação preguiçosa) e geraria senhas diferentes no mesmo Secret.
    - name: Gerar a senha do banco
      when: db_secret.rc != 0
      no_log: true
      ansible.builtin.set_fact:
        db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

    # Só cria se não existir: gerar outra senha depois que o banco foi
    # inicializado deixaria a aplicação sem acesso.
    - name: Criar o Secret do banco com senha aleatória (não vai para o Git)
      when: db_secret.rc != 0
      no_log: true
      ansible.builtin.command:
        cmd: "{{ kubectl }} apply -f -"
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: encurtador-db
            namespace: encurtador
          type: Opaque
          stringData:
            POSTGRES_USER: encurtador
            POSTGRES_DB: encurtador
            POSTGRES_PASSWORD: "{{ db_password }}"
            DATABASE_URL: "postgresql+psycopg://encurtador:{{ db_password }}@encurtador-db:5432/encurtador"

    - name: Verificar se o Secret do admin do Grafana já existe
      ansible.builtin.command: "{{ kubectl }} -n observabilidade get secret grafana-admin"
      register: grafana_secret
      failed_when: false
      changed_when: false

    # O chart do Grafana gera uma senha aleatória a cada renderização, o que deixaria
    # o Argo CD sempre OutOfSync. Por isso a senha vem deste Secret (existingSecret).
    - name: Criar o Secret do admin do Grafana com senha aleatória (não vai para o Git)
      when: grafana_secret.rc != 0
      no_log: true
      ansible.builtin.command:
        cmd: "{{ kubectl }} apply -f -"
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: grafana-admin
            namespace: observabilidade
          type: Opaque
          stringData:
            admin-user: admin
            admin-password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"

    # Sempre aplica: se o template ou os arquivos locais mudarem, o Secret é atualizado
    # e o Prometheus Operator recarrega a configuração do Alertmanager.
    - name: Criar ou atualizar a configuração do Alertmanager (e-mail, fora do Git)
      no_log: true
      vars:
        smtp_senha: "{{ lookup('ansible.builtin.file', config_local + '/gmail-app-password') }}"
      ansible.builtin.command:
        cmd: "{{ kubectl }} apply -f -"
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-monitoramento-alertmanager
            namespace: observabilidade
          type: Opaque
          stringData:
            alertmanager.yaml: |
              {{ lookup('ansible.builtin.template', templates_dir + '/alertmanager.yaml.j2') | indent(6) }}
      register: am_config
      changed_when: "'created' in am_config.stdout or 'configured' in am_config.stdout"

    - name: Aplicar a Application raiz (app-of-apps)
      ansible.builtin.command:
        cmd: "{{ kubectl }} apply -f -"
        stdin: "{{ lookup('ansible.builtin.file', files_dir + '/root-application-aws.yaml') }}"
      register: root_app
      changed_when: "'created' in root_app.stdout or 'configured' in root_app.stdout"

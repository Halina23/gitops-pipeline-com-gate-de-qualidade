---
# Funciona nos dois ambientes (VirtualBox e AWS). As diferenças ficam em
# inventory/<ambiente>/group_vars/k3s_cluster.yml.
- name: Bootstrap inicial - criar usuário definitivo e endurecer SSH
  hosts: k3s_cluster
  become: true

  vars:
    # Variáveis da play têm prioridade sobre o inventário: a primeira conexão
    # usa o usuário padrão da imagem, porque o admin_user ainda não existe.
    ansible_user: "{{ bootstrap_user }}"
    ansible_ssh_private_key_file: "{{ bootstrap_ssh_key }}"
    admin_pubkey: "{{ lookup('file', admin_pubkey_file) }}"

  tasks:
    - name: Configurar rede fixa (só no VirtualBox; eth0 fixo + eth1 DHCP)
      when: configure_static_network
      ansible.builtin.copy:
        dest: /etc/netplan/01-netcfg.yaml
        content: |
          network:
            version: 2
            ethernets:
              eth0:
                dhcp4: false
                addresses:
                  - {{ static_ip_cidr }}
              eth1:
                dhcp4: true
        mode: '0600'
      notify: Aplicar configuração de rede

    - name: Criar usuário definitivo
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true

    - name: Autorizar a chave SSH do usuário definitivo
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_pubkey }}"
        state: present

    - name: Permitir sudo sem senha para o usuário definitivo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Bloquear a senha do usuário padrão da imagem
      ansible.builtin.user:
        name: "{{ bootstrap_user }}"
        password_lock: true

    # validate: testa o arquivo com "sshd -t" antes de gravar. Uma linha
    # errada no sshd_config, sem isso, derrubaria o acesso à VM.
    - name: Desativar login root via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Reiniciar SSH

    - name: Desativar autenticação por senha via SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Reiniciar SSH

  # Handlers só rodam quando alguma tarefa avisou (notify) que mudou algo.
  handlers:
    - name: Aplicar configuração de rede
      ansible.builtin.command: netplan apply
      changed_when: true

    - name: Reiniciar SSH
      ansible.builtin.service:
        name: ssh
        state: restarted

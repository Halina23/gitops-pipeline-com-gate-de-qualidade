# Configurações do kube-prometheus-stack para o ambiente AWS (k3s, VM de 8 GB).

# Nomes curtos: monitoramento-prometheus, monitoramento-grafana...
fullnameOverride: monitoramento

# --- Ajustes para o k3s ---
# O k3s embute scheduler, controller-manager e etcd num único processo e não os
# expõe como o chart espera. Monitorá-los geraria alvos "fora do ar" e alertas falsos.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

# --- Prometheus ---
prometheus:
  prometheusSpec:
    # Ambiente efêmero: não precisa guardar histórico longo.
    retention: 2d
    # Por padrão o Prometheus só lê ServiceMonitors com a label do release do Helm.
    # Com "false", ele lê os de qualquer aplicação (ex.: o do encurtador).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1Gi }

# --- Alertmanager ---
alertmanager:
  alertmanagerSpec:
    # A configuração (destino por e-mail, com endereço e senha) fica num Secret
    # criado pelo Ansible: alertmanager-monitoramento-alertmanager. O chart não a gera.
    useExistingSecret: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

# --- Grafana ---
grafana:
  defaultDashboardsTimezone: browser
  # Senha do admin num Secret criado pelo Ansible (playbook 03-argocd.yml).
  # Sem isso, o chart gera uma senha aleatória a cada renderização: o Argo CD
  # veria o Secret sempre diferente (OutOfSync) e a senha trocaria sozinha.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Ambiente efêmero: os dashboards vêm do Git, não de um disco do Grafana.
  persistence:
    enabled: false
  # Loki (logs) e Tempo (traces) como fontes de dados. O Prometheus já vem
  # configurado pelo chart. "$$" escapa o "$": o Grafana trocaria "${...}" por uma
  # variável de ambiente ao carregar o arquivo.
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observabilidade.svc:3100
      jsonData:
        maxLines: 1000
        # Log -> trace: acha o trace_id no log JSON e vira um botão que abre o
        # trace no Tempo.
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id": "([0-9a-f]{32})"'
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: Ver trace no Tempo
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observabilidade.svc:3200
      jsonData:
        # Trace -> logs: num span, o botão "Logs for this span" busca no Loki os
        # logs com aquele trace_id. A tag service.name (encurtador) vira a label
        # app do Loki, que tem o mesmo valor.
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-1m"
          spanEndTimeShift: "1m"
          tags:
            - key: service.name
              value: app
  sidecar:
    dashboards:
      enabled: true
      # Carrega como dashboard todo ConfigMap com esta label, em qualquer namespace.
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# --- Demais componentes ---
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 20m, memory: 24Mi }
    limits: { memory: 64Mi }

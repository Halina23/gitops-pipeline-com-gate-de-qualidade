# Grafana Alloy: coleta os logs dos pods e envia ao Loki, e recebe os traces
# das aplicações (OTLP) e envia ao Tempo.
# Um único pod (Deployment) lendo os logs pela API do Kubernetes (como o
# "kubectl logs"). Num cluster com muitos nós, o recomendado seria um DaemonSet
# lendo os arquivos de log de cada nó.
controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
  # Portas extras no pod e no Service "alloy": as aplicações enviam os traces
  # para http://alloy.observabilidade.svc:4318 (OTLP/HTTP) ou :4317 (OTLP/gRPC).
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      // 1) Descobre os pods do cluster.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2) Escolhe as labels dos logs. Poucos valores possíveis (baixa cardinalidade):
      //    request_id e afins ficam no conteúdo e são filtrados na consulta (LogQL).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // 3) Lê os logs dos pods pela API do Kubernetes.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.nivel.receiver]
      }

      // 4) Nos logs em JSON (como os do encurtador), transforma o campo "level"
      //    em label (INFO, WARNING, ERROR...). Linhas que não são JSON passam direto.
      loki.process "nivel" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.loki.receiver]
      }

      // 5) Envia ao Loki.
      loki.write "loki" {
        endpoint {
          url = "http://loki.observabilidade.svc:3100/loki/api/v1/push"
        }
      }

      // --- Traces ---

      // 6) Recebe os traces das aplicações por OTLP.
      otelcol.receiver.otlp "apps" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      // 7) Junta os spans em lotes antes de enviar (menos conexões, menos CPU).
      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // 8) Envia ao Tempo por OTLP/gRPC. Sem TLS: o tráfego não sai do cluster.
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observabilidade.svc:4317"
          tls {
            insecure = true
          }
        }
      }

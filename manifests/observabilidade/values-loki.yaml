# Loki no modo SingleBinary: um único pod com todas as funções (receber, guardar,
# buscar). Os modos distribuídos do chart são para instalações grandes.
deploymentMode: SingleBinary

loki:
  # Sem multi-tenancy: um único "inquilino" (o cluster todo).
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # Logs guardados no disco da própria VM (somem no destroy, como as métricas).
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 48h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# --- Modos distribuídos: desligados ---
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# --- Componentes extras: desligados para economizar memória ---
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

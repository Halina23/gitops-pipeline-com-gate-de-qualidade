# A aplicação. Onda 2: sobe depois do banco (0) e das migrations (1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encurtador
  namespace: encurtador
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encurtador
  template:
    metadata:
      labels:
        app: encurtador
    spec:
      # O Kubernetes recusa o container se ele tentar rodar como root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: encurtador
          image: ghcr.io/halina23/encurtador-links:sha-f0c46d56ec9abf2af617555e78c16a6007159e46
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: encurtador-db, key: DATABASE_URL }
            - name: LOG_LEVEL
              value: INFO
            # BASE_URL vazio: os links curtos usam o endereço da requisição.
            # Traces (OpenTelemetry): enviados ao Alloy, que repassa ao Tempo.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.observabilidade.svc:4318
            - name: OTEL_SERVICE_NAME
              value: encurtador
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Liveness: o processo está vivo? (não depende do banco)
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          # Readiness: pronto para tráfego? (testa o banco)
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: encurtador
  namespace: encurtador
  # Label usada pelo ServiceMonitor para encontrar este Service.
  labels:
    app: encurtador
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app: encurtador
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Rota pública: o Traefik (Ingress Controller do k3s) recebe na porta 80 da VM.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: encurtador
  namespace: encurtador
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: encurtador
                port:
                  name: http

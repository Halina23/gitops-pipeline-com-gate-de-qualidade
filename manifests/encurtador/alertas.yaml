# Regras de alerta do encurtador (lidas pelo Prometheus).
# Onda 3 + SkipDryRunOnMissingResource: o CRD de PrometheusRule vem do
# kube-prometheus-stack; se ainda não existir, o Argo CD tenta de novo depois.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: encurtador-alertas
  namespace: encurtador
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: encurtador
      rules:
        # "Fora do ar" do ponto de vista do usuário: nenhum pod pronto para receber
        # tráfego. Só "up" não bastaria: com o banco inacessível a aplicação segue viva
        # (/metrics responde), mas sai do tráfego e o usuário recebe 503.
        - alert: EncurtadorForaDoAr
          expr: |
            (kube_deployment_status_replicas_available{namespace="encurtador", deployment="encurtador"} == 0)
            or
            absent(up{job="encurtador", namespace="encurtador"} == 1)
          for: 1m
          labels:
            severity: critical
            servico: encurtador
          annotations:
            summary: "Encurtador fora do ar"
            description: "Nenhuma instância do encurtador está pronta para receber tráfego há mais de 1 minuto."

        # Percentual (não o total) de respostas 5xx, só de tráfego de usuários.
        - alert: EncurtadorErros5xxAltos
          expr: |
            (
              sum(rate(http_requests_total{namespace="encurtador", route!~"/metrics|/health|/ready", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{namespace="encurtador", route!~"/metrics|/health|/ready"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            servico: encurtador
          annotations:
            summary: "Muitos erros 5xx no encurtador"
            description: "{{ $value | humanizePercentage }} das requisições terminaram em erro 5xx nos últimos 5 minutos."

        - alert: EncurtadorLento
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="encurtador", route!~"/metrics|/health|/ready"}[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            servico: encurtador
          annotations:
            summary: "Encurtador lento"
            description: "O p95 da latência está em {{ $value | humanizeDuration }} (limite: 500 ms)."
